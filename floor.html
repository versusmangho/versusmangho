<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>층수 측정기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+KR:wght@300;500;700&display=swap');
        
        body {
            background: #0f172a;
            color: #f1f5f9;
            font-family: 'Noto Sans KR', sans-serif;
        }
        .header-font { font-family: 'Orbitron', sans-serif; }
        .track-row {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .track-row:hover {
            border-color: #3b82f6;
            background: rgba(30, 41, 59, 1);
        }
        .floor-value {
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
        .loading-shimmer {
            background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .track-row.played {
            background: rgba(34, 197, 94, 0.15);
            border-color: #22c55e !important;
            opacity: 0.8;
        }
        .track-row.played .status-played { display: inline-block; }
        .track-row.banned {
            background: rgba(239, 68, 68, 0.15);
            border-color: #ef4444 !important;
            opacity: 0.8;
        }
        .track-row.banned .status-banned { display: inline-block; }
        #screenshotContainer { margin-bottom: 2rem; display: none; justify-content: center; }
        #screenshotPreview {
            max-width: 300px;
            cursor: pointer;
            border-radius: 0.75rem;
            border: 2px solid #334155;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        #screenshotPreview.expanded { max-width: 100%; border-color: #3b82f6; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2); }
        .mode-toggle-container {
            position: absolute; top: 2rem; right: 2rem; display: flex;
            background: rgba(30, 41, 59, 0.8); padding: 4px; border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1); z-index: 50;
        }
        .mode-btn { padding: 6px 16px; border-radius: 8px; font-size: 0.875rem; font-weight: 600; transition: all 0.2s; cursor: pointer; }
        .mode-btn.active { background: #3b82f6; color: white; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .mode-btn:not(.active):hover { background: rgba(255, 255, 255, 0.05); }
        .general-grid {
            display: grid; grid-template-columns: auto repeat(4, 1fr); gap: 1px;
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; overflow: hidden;
        }
        .grid-cell { background: #1e293b; padding: 12px 8px; text-align: center; font-family: 'Orbitron', sans-serif; font-size: 0.85rem; }
        .grid-header { background: #334155; font-weight: bold; color: #94a3b8; font-size: 0.75rem; }
        .grid-row-label { background: #334155; font-weight: bold; color: #94a3b8; display: flex; align-items: center; justify-content: center; padding: 0 12px; }
        .grid-value { color: #3b82f6; font-weight: bold; }
        .grid-value.empty { color: #475569; font-weight: normal; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="mode-toggle-container">
        <div id="mode-versus" class="mode-btn active" onclick="setMode('versus')">버망호 모드</div>
        <div id="mode-general" class="mode-btn" onclick="setMode('general')">일망호 모드</div>
    </div>

    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-10">
            <h1 class="header-font text-4xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500 mb-2">FLOOR METER</h1>
            <p class="text-gray-400 font-light uppercase tracking-widest text-sm">층수 측정기 (v-archive 및 로페봇 기반)</p>
        </header>

        <div id="dropZone" class="mb-8 border-2 border-dashed border-slate-700 rounded-2xl p-8 text-center cursor-pointer hover:border-blue-500 transition-colors bg-slate-900/50">
            <p class="text-slate-400 mb-2">스크린샷을 복사한 후 <kbd class="bg-slate-800 px-2 py-1 rounded text-white">Ctrl + V</kbd>를 누르세요</p>
            <p class="text-xs text-slate-500">16:9 비율의 스크린샷만 인식할 수 있습니다.</p>
        </div>

        <div id="messageZone" class="text-center text-yellow-400 mb-4 h-6 text-sm"></div>

        <div id="hashUploadContainer" class="hidden mb-8 p-6 bg-slate-900/80 border border-yellow-500/30 rounded-2xl text-center">
            <p class="text-yellow-500 mb-4 text-sm font-bold">⚠️ 해시 데이터(hashes.json)를 불러오지 못했습니다.</p>
            <label class="bg-yellow-600 hover:bg-yellow-500 text-white px-4 py-2 rounded-lg cursor-pointer transition-colors inline-block font-bold text-sm">
                해시 파일 선택
                <input type="file" id="hashFileInput" class="hidden" accept=".json" onchange="handleHashUpload(this)">
            </label>
            <p class="text-slate-500 mt-2 text-xs">로컬 환경에서는 hashes.json 파일을 직접 선택해야 합니다.</p>
        </div>

        <div id="screenshotContainer"><img id="screenshotPreview" alt="Original Screenshot"></div>
        <div id="resultList" class="space-y-4"><div class="text-center py-20 text-slate-600 italic">페이지 로딩 중...</div></div>
    </div>
    
    <script>
        const resultList = document.getElementById('resultList');
        const BASE_W = 2560, BASE_H = 1440;
        const RATIO_X_START = 307 / BASE_W, RATIO_THUMB_W = 240 / BASE_W, RATIO_GAP = 186.75 / BASE_W, RATIO_Y_START = 545 / BASE_H, RATIO_THUMB_H = 240 / BASE_H, RATIO_BAR_H = 43 / BASE_H;
        const RATIO_GENERAL_X = 885 / BASE_W, RATIO_GENERAL_Y = 711 / BASE_H, RATIO_GENERAL_W = 80 / BASE_W, RATIO_GENERAL_H = 80 / BASE_H;

        let currentMode = 'versus';
        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`mode-${mode}`).classList.add('active');
            window.lastProcessedImg = null; lastImageHash = null;
            renderStatus();
            document.getElementById('screenshotContainer').style.display = 'none';
            document.getElementById('dropZone').style.display = 'block';
        }

        const BAR_SPLIT = 0.5, W_AHASH = 1.0, W_DHASH = 1.0;
        const thumbRefs = [], buttonRefs = {}, diffRefs = {}, songTagsDatabase = {};
        let isProcessing = false, lastImageHash = null;
        const COOLDOWN_MS = 3000;

        function cropToCanvas(sourceImg, x, y, w, h) {
            const c = document.createElement('canvas');
            c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h));
            c.getContext('2d', { willReadFrequently: true }).drawImage(sourceImg, x, y, w, h, 0, 0, c.width, c.height);
            return c;
        }

        function parseTags(tagStr, currentButton = null, currentDifficulty = null) {
            if (!tagStr) return [];
            const circleMap = { '{1}': '①', '{2}': '②', '{3}': '③', '{4}': '④', '{5}': '⑤', '{6}': '⑥', '{7}': '⑦', '{8}': '⑧', '{9}': '⑨', '{10}': '⑩' };
            const diffSuffixes = ['_MX', '_HD', '_NM'];

            return tagStr.split(',')
                .map(t => t.trim())
                .filter(t => {
                    if (!t || !t.includes(':') || t.startsWith('GENRE:')) return false;
                    const [prefix, ...rest] = t.split(':'), content = rest.join(':').trim();
                    if (prefix === 'BPM') return true;
                    if (prefix.includes('B')) {
                        const buttons = prefix.split('&').map(b => b.trim());
                        if (currentButton && !buttons.includes(currentButton)) return false;
                        if (currentDifficulty) {
                            const baseContent = content.replace(/\|?\{?\d+\}?/g, '').trim();
                            const foundSuffix = diffSuffixes.find(s => baseContent.endsWith(s));
                            if (currentDifficulty === 'SC') return !foundSuffix;
                            else return baseContent.endsWith('_' + currentDifficulty);
                        }
                        return true;
                    }
                    return false;
                })
                .map(t => {
                    let result = t;
                    for (const [key, val] of Object.entries(circleMap)) result = result.split(key).join(val);
                    result = result.split('|').join('');
                    const [prefix, ...rest] = result.split(':'), content = rest.join(':').trim();
                    if (prefix === 'BPM') return result;
                    let finalRes = currentButton ? content : result;
                    diffSuffixes.forEach(s => { finalRes = finalRes.replace(new RegExp(s + '(?=[①-⑩]|$)'), ''); });
                    return finalRes;
                });
        }

        function getSongTagsHtml(titleId, currentButton = null, currentDifficulty = null) {
            const tags = songTagsDatabase[titleId]; if (!tags) return '';
            const filteredTags = parseTags(tags, currentButton, currentDifficulty); if (filteredTags.length === 0) return '';
            return `<div class="flex flex-wrap gap-1.5 mt-1.5">${filteredTags.map(tag => {
                const isBpm = tag.startsWith('BPM:'), bgColor = isBpm ? 'bg-blue-900/40' : 'bg-slate-800/60', textColor = isBpm ? 'text-blue-300' : 'text-slate-300', borderColor = isBpm ? 'border-blue-700/50' : 'border-slate-700/50';
                return `<span class="px-2 py-0.5 rounded text-[11px] font-bold border ${bgColor} ${textColor} ${borderColor}">${tag}</span>`;
            }).join('')}</div>`;
        }

        function getGrayscaleFromCanvas(canvas, w, h) {
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            const data = ctx.getImageData(0, 0, w, h).data, gray = new Float32Array(w * h);
            for (let i = 0, p = 0; i < data.length; i += 4, p++) gray[p] = (data[i] + data[i + 1] + data[i + 2]) / 3.0;
            return gray;
        }

        function aHashFromCanvas(canvas) {
            const w = 8, h = 8, c = document.createElement('canvas'); c.width = w; c.height = h;
            c.getContext('2d').drawImage(canvas, 0, 0, w, h); const gray = getGrayscaleFromCanvas(c, w, h);
            let avg = 0; for (let i = 0; i < gray.length; i++) avg += gray[i]; avg /= gray.length;
            let hi = 0, lo = 0; for (let i = 0; i < 32; i++) hi = (hi << 1) | (gray[i] >= avg ? 1 : 0);
            for (let i = 32; i < 64; i++) lo = (lo << 1) | (gray[i] >= avg ? 1 : 0);
            return { hi: hi >>> 0, lo: lo >>> 0 };
        }

        function dHashFromCanvas(canvas) {
            const w = 9, h = 8, c = document.createElement('canvas'); c.width = w; c.height = h;
            c.getContext('2d').drawImage(canvas, 0, 0, w, h); const gray = getGrayscaleFromCanvas(c, w, h);
            let hi = 0, lo = 0; let bitIndex = 0;
            for (let y = 0; y < 8; y++) {
                for (let x = 0; x < 8; x++) {
                    const bit = gray[y * 9 + x] < gray[y * 9 + x + 1] ? 1 : 0;
                    if (bitIndex < 32) hi = (hi << 1) | bit; else lo = (lo << 1) | bit;
                    bitIndex++;
                }
            }
            return { hi: hi >>> 0, lo: lo >>> 0 };
        }

        function popcnt32(v) {
            v = v - ((v >>> 1) & 0x55555555); v = (v & 0x33333333) + ((v >>> 2) & 0x33333333);
            return (((v + (v >>> 4)) & 0x0F0F0F0F) * 0x01010101) >>> 24;
        }
        function ham64(a, b) { if (!a || !b) return Infinity; return popcnt32((a.hi ^ b.hi) >>> 0) + popcnt32((a.lo ^ b.lo) >>> 0); }

        function dct1D(vec, N) {
            const out = new Float32Array(N), factor = Math.PI / N;
            for (let u = 0; u < N; u++) {
                let sum = 0; for (let x = 0; x < N; x++) sum += vec[x] * Math.cos((x + 0.5) * u * factor);
                out[u] = ((u === 0) ? Math.sqrt(1 / N) : Math.sqrt(2 / N)) * sum;
            }
            return out;
        }

        function pHashFromCanvas(canvas) {
            const N = 32, c = document.createElement('canvas'); c.width = N; c.height = N;
            c.getContext('2d').drawImage(canvas, 0, 0, N, N); const gray = getGrayscaleFromCanvas(c, N, N), tmp = new Array(N);
            for (let y = 0; y < N; y++) {
                const row = new Float32Array(N); for (let x = 0; x < N; x++) row[x] = gray[y * N + x];
                tmp[y] = dct1D(row, N);
            }
            const dct = new Array(N);
            for (let x = 0; x < N; x++) {
                const col = new Float32Array(N); for (let y = 0; y < N; y++) col[y] = tmp[y][x];
                const colD = dct1D(col, N);
                for (let y = 0; y < N; y++) { if (!dct[y]) dct[y] = new Float32Array(N); dct[y][x] = colD[y]; }
            }
            const vals = []; for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) if (!(x === 0 && y === 0)) vals.push(dct[y][x]);
            const sorted = vals.slice().sort((a, b) => a - b), med = sorted[Math.floor(sorted.length / 2)];
            let hi = 0, lo = 0, i = 0;
            for (let y = 0; y < 8; y++) {
                for (let x = 0; x < 8; x++) {
                    if (x === 0 && y === 0) continue;
                    const bit = dct[y][x] > med ? 1 : 0;
                    if (i < 32) hi = (hi << 1) | bit; else lo = (lo << 1) | bit;
                    i++;
                }
            }
            if (i < 64) {
                const pad = 64 - i;
                if (pad <= 32) lo = (lo << pad) >>> 0; else { hi = (hi << (pad - 32)) >>> 0; lo = 0; }
            }
            return { hi: hi >>> 0, lo: lo >>> 0 };
        }

        const songDatabase = {}; let statusLogs = []; window.lastProcessedImg = null; 
        function renderStatus() {
            if (!resultList) return;
            resultList.innerHTML = `<div class="text-center py-20 space-y-2">${statusLogs.map(log => `<p class="text-slate-400 text-sm">${log}</p>`).join('')}</div>`;
        }
        function updateStatus(msg, isAppend = false) {
            if (isAppend && statusLogs.length > 0) statusLogs[statusLogs.length - 1] += ` ${msg}`; else statusLogs.push(msg);
            renderStatus();
        }

        async function loadHashes() {
            updateStatus("v-archive에서 곡 정보를 받아오는 중..");
            const songApiUrl = 'https://v-archive.net/db/v2/songs.json', tagApiUrl = 'https://data.xn--2o2bk9ff9x.com/tags/song_tags.json', proxyUrl = 'https://api.allorigins.win/raw?url=';
            try {
                let res; try { res = await fetch(songApiUrl, { mode: 'cors' }); } catch (err) { res = await fetch(proxyUrl + encodeURIComponent(songApiUrl)); }
                if (res && res.ok) { 
                    const songs = await res.json();
                    songs.forEach(s => { songDatabase[s.title] = s; }); 
                    updateStatus("<span class='text-green-500 font-bold'>완료!</span>", true); 
                } else throw new Error();
            } catch (e) { updateStatus("<span class='text-red-500 font-bold'>실패!</span>", true); }

            updateStatus("곡 상세 태그 정보를 받아오는 중..");
            try {
                let res; try { res = await fetch(tagApiUrl, { mode: 'cors' }); } catch (err) { res = await fetch(proxyUrl + encodeURIComponent(tagApiUrl)); }
                if (res && res.ok) { 
                    const d = await res.json(); 
                    if (d.items) d.items.forEach(i => { songTagsDatabase[i.song_title] = i.tags; }); 
                    updateStatus("<span class='text-green-500 font-bold'>완료!</span>", true); 
                } else throw new Error();
            } catch (e) { updateStatus("<span class='text-yellow-500 font-bold'>실패!</span>", true); }

            updateStatus("이미지분석을 위한 데이터를 불러오는 중..");
            try {
                const hRes = await fetch('hashes.json');
                if (hRes.ok) {
                    const data = await hRes.json(); 
                    Object.assign(buttonRefs, data.trackinfo.buttons); Object.assign(diffRefs, data.trackinfo.diffs);
                    thumbRefs.length = 0; thumbRefs.push(...data.thumbnails); document.getElementById('hashUploadContainer').classList.add('hidden');
                    updateStatus("<span class='text-green-500 font-bold'>완료!</span>", true);
                } else throw new Error();
            } catch (e) {
                updateStatus("<span class='text-yellow-500 font-bold' id='hashStatusLabel'>중단!</span>", true);
                document.getElementById('hashUploadContainer').classList.remove('hidden'); return false;
            }
            return true;
        }

        function handleHashUpload(input) {
            const file = input.files[0]; if (!file) return;
            const reader = new FileReader(); resultList.innerHTML = `<div class="text-center py-20 text-slate-600 italic">데이터 처리 중...</div>`;
            reader.onload = function(e) {
                try {
                    const d = JSON.parse(e.target.result);
                    if (d.trackinfo) {
                        Object.assign(buttonRefs, d.trackinfo.buttons); Object.assign(diffRefs, d.trackinfo.diffs);
                        thumbRefs.length = 0; thumbRefs.push(...d.thumbnails); document.getElementById('hashUploadContainer').classList.add('hidden');
                        if (statusLogs.length > 0) statusLogs[statusLogs.length - 1] = statusLogs[statusLogs.length - 1].replace(/<span.*>.*<\/span>/, "<span class='text-green-500 font-bold'>완료!</span>");
                        renderStatus(); updateStatus("<div class='mt-6 text-blue-400 font-bold text-lg'>준비 완료!</div>");
                    }
                } catch (err) { alert("오류 발생"); }
            };
            reader.readAsText(file);
        }

        async function init() { statusLogs = []; const s = await loadHashes(); if (s) updateStatus("<div class='mt-6 text-blue-400 font-bold text-lg'>준비 완료!</div>"); }

        function getSortedMatches(hashA, hashD) {
            return thumbRefs.map(ref => ({ id: ref.id, score: ham64(hashA, ref.ah) * W_AHASH + ham64(hashD, ref.dh) * W_DHASH })).sort((a, b) => a.score - b.score);
        }
        function bestMatchPhash(targetPh, refMap) {
            let best = { key: null, dist: Infinity };
            for (const key of Object.keys(refMap)) { const dist = ham64(targetPh, refMap[key].ph); if (dist < best.dist) best = { key, dist }; }
            return best;
        }
        function showTemporaryMessage(msg, duration = 2500) {
            const z = document.getElementById('messageZone'); if (!z) return; z.textContent = msg;
            setTimeout(() => { if (z.textContent === msg) z.textContent = ''; }, duration);
        }

        window.addEventListener('paste', async (e) => {
            const now = Date.now(); if (isProcessing) return;
            if (now - (window.lastProcessTime || 0) < COOLDOWN_MS) { showTemporaryMessage("쿨다운 중..."); return; }
            const items = e.clipboardData.items;
            for (let item of items) {
                if (item.type.indexOf('image') !== -1) {
                    const blob = item.getAsFile(), img = new Image(); img.src = URL.createObjectURL(blob);
                    img.onload = () => {
                        const prev = document.getElementById('screenshotPreview'), cont = document.getElementById('screenshotContainer'), drop = document.getElementById('dropZone');
                        if (drop) drop.style.display = 'none'; cont.style.display = 'flex'; prev.src = img.src;
                        const full = document.createElement('canvas'); full.width = img.width; full.height = img.height; full.getContext('2d').drawImage(img, 0, 0);
                        const hash = dHashFromCanvas(full); if (lastImageHash && ham64(lastImageHash, hash) === 0) { showTemporaryMessage("동일 이미지"); return; }
                        isProcessing = true; lastImageHash = hash; window.lastProcessTime = Date.now();
                        processImage(img).finally(() => { isProcessing = false; });
                    };
                }
            }
        });

        async function processImage(img) {
            window.lastProcessedImg = img; statusLogs = []; resultList.innerHTML = '';
            const W = img.width, H = img.height;
            if (currentMode === 'versus') {
                for (let i = 0; i < 5; i++) {
                    const row = createLoadingRow(i + 1); resultList.appendChild(row);
                    const x = (RATIO_X_START + (RATIO_THUMB_W + RATIO_GAP) * i) * W, y = RATIO_Y_START * H, tw = RATIO_THUMB_W * W, th = RATIO_THUMB_H * H, by = (RATIO_Y_START + RATIO_THUMB_H) * H, bh = RATIO_BAR_H * H;
                    const thumb = cropToCanvas(img, x, y, tw, th), ah = aHashFromCanvas(thumb), dh = dHashFromCanvas(thumb), bar = cropToCanvas(img, x, by, tw, bh);
                    const left = cropToCanvas(bar, 0, 0, bar.width * BAR_SPLIT, bar.height), right = cropToCanvas(bar, left.width, 0, bar.width * (1 - BAR_SPLIT), bar.height);
                    row.matches = getSortedMatches(ah, dh); row.matchIndex = 0; row.btnPh = pHashFromCanvas(left); row.diffPh = pHashFromCanvas(right);
                    displayMatch(row, 0);
                }
            } else {
                const row = createLoadingRow(1); resultList.appendChild(row);
                const x = RATIO_GENERAL_X * W, y = RATIO_GENERAL_Y * H, tw = RATIO_GENERAL_W * W, th = RATIO_GENERAL_H * H;
                const thumb = cropToCanvas(img, x, y, tw, th), ah = aHashFromCanvas(thumb), dh = dHashFromCanvas(thumb), matches = getSortedMatches(ah, dh), best = matches[0], data = getSongDataSync(best.id);
                if (data && data.success) { row.matches = matches; row.matchIndex = 0; updateGeneralRow(row, data, best.id); }
            }
        }

        function getFloorColor(fV) {
            const f = parseFloat(fV); if (isNaN(f)) return '#60a5fa';
            const fl = Math.floor(f / 10); if (fl >= 16) return '#c084fc';
            const h = 240 - (Math.max(1, Math.min(15, fl)) - 1) * (240 / 14); return `hsl(${h}, 100%, 70%)`;
        }

        function getDifficultyBgColor(level, diff, floor) {
            if (!floor || floor === '-' || isNaN(parseFloat(floor))) return 'rgba(71, 85, 105, 0.2)';
            const f = Math.floor(parseFloat(floor) / 10), l = parseInt(level);
            const adj = (diff === 'SC') ? l : (l - 11) * 2;
            if (adj === f) return 'rgba(234, 179, 8, 0.2)'; 
            if (adj > f) return 'rgba(56, 189, 248, 0.2)'; 
            return 'rgba(239, 68, 68, 0.2)';
        }

        function updateGeneralRow(row, data, titleId) {
            row.className = 'track-row p-6 rounded-xl block opacity-100 shadow-lg relative';
            const btnList = ['4B', '5B', '6B', '8B'], diffList = ['NM', 'HD', 'MX', 'SC'];
            let grid = `<div class="general-grid mt-4"><div class="grid-cell grid-header"></div>${diffList.map(d => `<div class="grid-cell grid-header">${d}</div>`).join('')}`;
            btnList.forEach(btn => {
                grid += `<div class="grid-cell grid-row-label">${btn}</div>`;
                diffList.forEach(diff => {
                    const p = data.patterns?.[btn]?.[diff], fVal = p?.floor ?? '-', l = p?.level ?? 0, fName = p?.floorName ?? (fVal !== '-' ? String(fVal) : '-');
                    const color = getFloorColor(fVal), bgColor = getDifficultyBgColor(l, diff, fVal);
                    grid += `<div class="grid-cell ${fName==='-'?'empty':'grid-value'}" style="${fName==='-'?'':(`color: ${color}; background-color: ${bgColor}`)}">${fName}</div>`;
                });
            });
            grid += `</div>`;
            row.innerHTML = `<div class="flex items-center justify-between mb-2"><div class="flex items-center space-x-6"><img src="https://v-archive.net/static/images/jackets/${titleId}.jpg" class="w-24 h-24 rounded-lg object-cover border-2 border-slate-700"><div><h3 class="font-bold text-white text-2xl mb-1">${data.name}</h3><div class="flex items-center space-x-3"><p class="text-slate-400 text-sm">ID: ${titleId}</p><button class="recheck-btn bg-slate-700 text-white text-[10px] px-2 py-0.5 rounded" onclick="event.stopPropagation(); handleRecheck(this)">재검토</button></div></div></div></div><div class="mt-2 px-2">${getSongTagsHtml(titleId)}</div>${grid}`;
        }

        function displayMatch(row, index) {
            const m = row.matches[index], bM = bestMatchPhash(row.btnPh, buttonRefs), dM = bestMatchPhash(row.diffPh, diffRefs), btn = bM.key || "4B", diff = dM.key || "SC", tId = m.id, d = getSongDataSync(tId);
            if (d && d.success) {
                row.apiData = d; const p = d.patterns?.[btn]?.[diff], fV = p?.floor ?? "-", fN = p?.floorName ?? (fV !== "-" ? String(fV) : "NO DATA");
                updateRow(row, { titleId: tId, name: d.name, button: btn, difficulty: diff, floorName: fN, floor: fV, level: p?.level || 0 });
            } else updateRow(row, { titleId: tId, name: `ID ${tId}`, button: btn, difficulty: diff, floorName: "NO DATA", floor: "-", level: 0 });
        }

        function updateRow(row, info) {
            row.className = 'track-row p-4 rounded-xl flex items-center justify-between opacity-100 shadow-lg relative'; row.setAttribute('data-title-id', info.titleId);
            const bL = ['4B', '5B', '6B', '8B'], dL = ['NM', 'HD', 'MX', 'SC'];
            row.innerHTML = `<div class="flex items-center space-x-4"><img src="https://v-archive.net/static/images/jackets/${info.titleId}.jpg" class="w-20 h-20 rounded-lg object-cover border border-slate-700"><div><h3 class="font-bold text-white text-lg leading-tight">${info.name}</h3><div class="tags-container">${getSongTagsHtml(info.titleId, info.button, info.difficulty)}</div><div class="flex items-center space-x-1 mt-1.5"><select class="btn-select px-1 py-0.5 rounded text-[10px] font-bold text-white bg-slate-700 appearance-none" onchange="event.stopPropagation(); handleCorrection(this)">${bL.map(b => `<option value="${b}" ${b===info.button?'selected':''}>${b}</option>`).join('')}</select><select class="diff-select px-1 py-0.5 rounded text-[10px] font-bold text-white bg-slate-700 appearance-none" onchange="event.stopPropagation(); handleCorrection(this)">${dL.map(d => `<option value="${d}" ${d===info.difficulty?'selected':''}>${d}</option>`).join('')}</select><button class="recheck-btn ml-2 bg-slate-700 text-white text-[10px] px-2 py-0.5 rounded" onclick="event.stopPropagation(); handleRecheck(this)">재검토</button></div></div></div><div class="text-right flex flex-col items-end"><p class="text-xs text-slate-500 uppercase font-bold">Floor</p><div class="floor-area" style="border-radius: 8px; padding: 4px 8px; background-color: ${getDifficultyBgColor(info.level, info.difficulty, info.floor)}"><p class="floor-value text-3xl font-black" style="color: ${getFloorColor(info.floor)}">${info.floorName}</p></div></div>`;
            updateSelectColors(row.querySelector('.btn-select'), row.querySelector('.diff-select'));
        }

        function handleCorrection(el) {
            const row = el.closest('.track-row'), bS = row.querySelector('.btn-select'), dS = row.querySelector('.diff-select'), btn = bS.value, diff = dS.value;
            updateSelectColors(bS, dS); const tId = row.getAttribute('data-title-id'), d = getSongDataSync(tId);
            const tC = row.querySelector('.tags-container'); if (tC) tC.innerHTML = getSongTagsHtml(tId, btn, diff);
            const p = d.patterns?.[btn]?.[diff], fE = row.querySelector('.floor-value'), fA = row.querySelector('.floor-area');
            if (fE) {
                const fV = p?.floor ?? "-", fN = p?.floorName ?? (fV !== "-" ? String(fV) : "NO DATA"), l = p?.level || 0;
                fE.innerText = fN; fE.style.color = getFloorColor(fV);
                if (fA) {
                    fA.style.backgroundColor = getDifficultyBgColor(l, diff, fV);
                    fA.style.borderRadius = '8px'; fA.style.padding = '4px 8px';
                }
            }
        }

        function updateSelectColors(bE, dE) {
            const bC = { '4B': 'bg-green-600', '5B': 'bg-sky-600', '6B': 'bg-orange-600', '8B': 'bg-indigo-600' }, dC = { 'SC': 'bg-purple-600', 'MX': 'bg-red-600', 'HD': 'bg-orange-600', 'NM': 'bg-yellow-600' };
            const all = ['bg-slate-700', 'bg-slate-600', ...Object.values(bC), ...Object.values(dC)];
            all.forEach(c => { bE.classList.remove(c); dE.classList.remove(c); });
            if (bC[bE.value]) bE.classList.add(bC[bE.value]); if (dC[dE.value]) dE.classList.add(dC[dE.value]);
        }

        function getSongDataSync(tId) { const s = songDatabase[parseInt(tId)]; return s ? { success: true, id: s.title, name: s.name, patterns: s.patterns } : { success: false }; }

        async function handleRecheck(btn) {
            const r = btn.closest('.track-row'); if (!r || !r.matches) return;
            r.matchIndex = (r.matchIndex + 1) % Math.min(r.matches.length, 10);
            if (currentMode === 'general') { const m = r.matches[r.matchIndex], d = getSongDataSync(m.id); if (d.success) updateGeneralRow(r, d, m.id); }
            else displayMatch(r, r.matchIndex);
        }

        function createLoadingRow(index) {
            const d = document.createElement('div'); d.className = 'track-row p-4 rounded-xl flex items-center justify-between opacity-50';
            d.innerHTML = `<div class="flex items-center space-x-4 w-full"><div class="w-20 h-20 rounded-lg bg-slate-800 loading-shimmer"></div><div class="flex-grow"><div class="h-5 w-3/4 bg-slate-800 mb-2 loading-shimmer rounded"></div><div class="h-4 w-1/2 bg-slate-800 loading-shimmer rounded"></div></div><div class="text-right"><div class="h-8 w-20 bg-slate-800 loading-shimmer rounded"></div></div></div>`;
            return d;
        }

        resultList.addEventListener('click', (e) => { const r = e.target.closest('.track-row'); if (r) { r.classList.toggle('played'); r.classList.remove('banned'); } });
        resultList.addEventListener('contextmenu', (e) => { const r = e.target.closest('.track-row'); if (r) { e.preventDefault(); r.classList.toggle('banned'); r.classList.remove('played'); } });
        window.onload = init;
    </script>
</body>
</html>
